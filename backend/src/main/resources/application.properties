spring.application.name=fashionshop

# Datasource (MySQL - Laragon local, root / no password)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/fashionshop_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=KEbHoF0MQKpIDXNtdNbWG5c3Rc94YUoBhuA03WXox8MiEpQOQB7CoMdBFe76ZBzlu423rSJNSCyy3N7FwUsj0g==
jwt.access-token-expiration-ms=1800000
jwt.refresh-token-expiration-ms=604800000

# Redis cache
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# Order
app.shipping-fee=30000

# VNPay (sandbox) - dang ky tai khoan test mien phi tai https://sandbox.vnpayment.vn de lay tmn-code/hash-secret
vnpay.tmn-code=
vnpay.hash-secret=
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:5174/payment/vnpay-return
vnpay.version=2.1.0
vnpay.command=pay
vnpay.currency=VND
vnpay.locale=vn

# File upload
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

